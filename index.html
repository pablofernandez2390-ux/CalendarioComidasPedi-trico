<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e07a3f">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="iconos/icon-192.png">
<link rel="apple-touch-icon" href="iconos/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Comidas">
<title>Calendario de comidas</title>
<style>
:root{--bg:#fbf6ee;--card:#fff;--ink:#2d2a26;--mut:#7a7268;--acc:#e07a3f;--ok:#3f8f6b;--bad:#c4513f;--line:#eadfce;--soft:#fdf0e1}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px;line-height:1.4}
main{max-width:720px;margin:0 auto;padding:14px}
h1,h2,h3{margin:.2em 0 .4em}
h2{font-size:1.25rem}
h3{font-size:1.05rem}
.mut{color:var(--mut);font-size:.88rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.card.hoy{border-color:var(--acc);box-shadow:0 0 0 2px #e07a3f33}
.hdr{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:6px}
.fecha{font-size:1.2rem;font-weight:700}
.alerta{background:#fdeaea;border:1px solid #f0c3bc;color:#8a2f22;border-radius:10px;padding:8px 10px;margin-top:8px;font-size:.9rem}
.slot{display:flex;flex-direction:column;gap:8px}
.slot .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.slot .nom{font-weight:700;font-size:1.05rem}
.slot .hora{color:var(--mut);font-size:.85rem}
.chk{display:flex;align-items:center;gap:10px;font-size:1.1rem;font-weight:600;padding:8px 12px;background:var(--soft);border-radius:12px;cursor:pointer}
.chk input{width:28px;height:28px;accent-color:var(--ok)}
.pend{color:var(--mut);font-size:.9rem}
.res.ok{color:var(--ok);font-weight:700}
.res.no{color:var(--bad);font-weight:700}
.act{border-left:5px solid var(--acc)}
.pas{opacity:.92}
select,input,textarea{font:inherit;padding:8px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:64px;resize:vertical}
input[type=checkbox]{width:auto}
label.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:6px 0}
label.row>span{min-width:110px}
label.f{display:block;margin:10px 0 2px;font-size:.88rem;color:var(--mut)}
button{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer}
button.sec{background:#efe4d3;color:var(--ink)}
button.del{background:#f6d9d4;color:#8a2f22}
button.sm{padding:5px 10px;font-size:.85rem}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:1px 9px;font-size:.78rem;margin-right:4px}
.warn{color:#8a2f22;font-size:.82rem;font-weight:600}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 8px;z-index:5}
nav button{background:none;color:var(--mut);padding:4px 6px;font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;border-radius:0}
nav button b{font-size:1.3rem}
nav button.on{color:var(--acc)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dn{font-size:.75rem;color:var(--mut)}
.cal .c{border:1px solid var(--line);border-radius:10px;background:#fff;padding:4px 0 5px;cursor:pointer;min-height:48px}
.cal .c.sel{border-color:var(--acc);background:var(--soft)}
.cal .c.hoyc{font-weight:800;color:var(--acc)}
.cal .c i{display:inline-block;width:7px;height:7px;border-radius:50%;margin:1px}
i.ok{background:var(--ok)}i.no{background:var(--bad)}i.nd{background:#ddd2c1}
.mes{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
#modal:empty{display:none}
#modal{position:fixed;inset:0;background:#0007;z-index:10;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:14px}
#modal .box{background:#fff;border-radius:16px;padding:16px;width:100%;max-width:560px;margin-top:20px}
.tipos{display:flex;gap:12px;flex-wrap:wrap}
.tipos label{display:flex;align-items:center;gap:5px}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
.disc{font-size:.8rem;color:var(--mut);margin-top:14px;text-align:center}
</style>
</head>
<body>
<main id="main"></main>
<div id="modal"></div>
<nav id="nav"></nav>

<script>
const KEY='calendarioComidas.v1';
const SLOTS=[{k:'desayuno',n:'Desayuno',e:'🥣'},{k:'almuerzo',n:'Almuerzo',e:'🍝'},{k:'merienda',n:'Merienda',e:'🍎'},{k:'cena',n:'Cena',e:'🥘'}];
const DIAS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const DS=['lun','mar','mié','jue','vie','sáb','dom'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const dIdx=d=>(d.getDay()+6)%7;
const uid=()=>'r'+Math.random().toString(36).slice(2,9);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fechaLarga=d=>cap(DIAS[dIdx(d)].toLowerCase())+' '+d.getDate()+' de '+MESES[d.getMonth()]+' de '+d.getFullYear();
const fechaCorta=d=>`${DS[dIdx(d)]} ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
const fechaHora=d=>`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;

/* ---------- Recetas básicas sugeridas ---------- */
const SUG=[
{n:'Leche con cacao y tostadas con queso',t:['desayuno','merienda'],i:'Leche, cacao en polvo, pan, queso',p:'Calentar la leche y mezclar con el cacao. Tostar el pan y colocar el queso.',ini:1},
{n:'Avena cocida con manzana y canela',t:['desayuno'],i:'Avena, leche, manzana, canela',p:'Cocinar la avena en la leche unos 5 minutos. Agregar manzana rallada y una pizca de canela.',ini:1},
{n:'Yogur con fruta y cereal sin azúcar agregada',t:['desayuno','merienda'],i:'Yogur natural, fruta de estación, cereal de avena o maíz sin azúcar',p:'Servir el yogur con la fruta en trozos y el cereal por encima.',ini:1},
{n:'Tostada con huevo revuelto y fruta',t:['desayuno'],i:'Pan, huevo, aceite o manteca, fruta',p:'Revolver el huevo en la sartén hasta que cuaje bien. Servir sobre la tostada, con fruta al lado.',ini:1},
{n:'Pan con ricota y banana',t:['desayuno','merienda'],i:'Pan, ricota, banana',p:'Untar el pan con ricota y agregar rodajas de banana.'},
{n:'Fruta de estación y vaso de leche',t:['merienda'],i:'Fruta de estación, leche',p:'Cortar la fruta en trozos adecuados a la edad y servir con la leche.',ini:1},
{n:'Licuado de banana y leche',t:['merienda'],i:'Banana, leche',p:'Licuar la banana con la leche bien fría. Sin azúcar agregada.',ini:1},
{n:'Sándwich de queso y tomate',t:['merienda'],i:'Pan, queso, tomate',p:'Armar el sándwich con queso y rodajas finas de tomate.',ini:1},
{n:'Budín de banana casero',t:['merienda'],i:'Bananas maduras, harina, huevo, aceite, polvo de hornear',p:'Pisar las bananas, mezclar con los demás ingredientes y hornear unos 40 minutos a 180 °C.'},
{n:'Galletas de avena caseras',t:['merienda'],i:'Avena, banana, canela, pasas de uva opcional',p:'Pisar la banana, mezclar con la avena, formar galletas y hornear 15 minutos a 180 °C.'},
{n:'Milanesa de pollo al horno con puré',t:['almuerzo','cena'],i:'Pechuga de pollo, huevo, pan rallado, papa, leche',p:'Pasar el pollo por huevo y pan rallado, hornear con un poco de aceite hasta dorar. Acompañar con puré de papa.',ini:1},
{n:'Guiso de lentejas con verduras',t:['almuerzo'],i:'Lentejas, zanahoria, zapallo, cebolla, papa, caldo',p:'Cocinar las lentejas con las verduras en cubos pequeños hasta que todo esté blando.',ini:1},
{n:'Arroz con pollo y zanahoria',t:['almuerzo','cena'],i:'Arroz, pollo, zanahoria, cebolla, morrón',p:'Rehogar la cebolla, agregar el pollo en trozos, las verduras y el arroz con agua o caldo. Cocinar tapado.',ini:1},
{n:'Fideos con salsa de tomate casera y queso',t:['almuerzo','cena'],i:'Fideos, tomate, cebolla, zanahoria, queso rallado',p:'Hacer la salsa con tomate, cebolla y zanahoria rallada. Mezclar con los fideos y queso.',ini:1},
{n:'Tortilla de papa y zanahoria con ensalada',t:['almuerzo','cena'],i:'Papa, zanahoria, huevos, cebolla, ensalada',p:'Cocinar las verduras en cubos, mezclar con huevo batido y cuajar en la sartén por ambos lados.',ini:1},
{n:'Pescado al horno con puré y brócoli',t:['almuerzo','cena'],i:'Filet de merluza, papa, brócoli, limón',p:'Hornear el filet con unas gotas de limón. Hervir el brócoli y la papa para el puré. Revisar que no queden espinas.'},
{n:'Pastel de carne y calabaza',t:['almuerzo','cena'],i:'Carne picada, cebolla, calabaza, papa',p:'Cocinar la carne con cebolla, cubrir con puré de calabaza y papa, gratinar al horno.'},
{n:'Albóndigas con puré de calabaza',t:['almuerzo','cena'],i:'Carne picada, huevo, pan rallado, calabaza',p:'Formar albóndigas y cocinarlas en salsa de tomate o al horno. Servir con puré de calabaza.'},
{n:'Tarta de zapallitos y queso',t:['almuerzo','cena'],i:'Masa de tarta, zapallitos, queso, huevos, cebolla',p:'Rehogar los zapallitos, mezclar con huevo y queso, y hornear sobre la masa.'},
{n:'Hamburguesa casera de lentejas con ensalada',t:['almuerzo','cena'],i:'Lentejas cocidas, avena, huevo, zanahoria rallada',p:'Pisar las lentejas, mezclar con los demás ingredientes, formar hamburguesas y dorar en sartén u horno.'},
{n:'Sopa de verduras con fideos',t:['cena'],i:'Zanahoria, zapallo, puerro, papa, fideos chicos',p:'Hervir las verduras en trozos pequeños, agregar los fideos al final.',ini:1},
{n:'Omelette de verduras con arroz',t:['cena'],i:'Huevos, espinaca o zapallito, queso, arroz',p:'Batir los huevos, agregar verduras cocidas y queso, cuajar en la sartén. Acompañar con arroz.',ini:1},
{n:'Pollo al horno con boniato',t:['cena'],i:'Muslos o suprema de pollo, boniato, aceite',p:'Hornear el pollo con el boniato en cubos hasta que todo esté tierno y bien cocido.',ini:1},
{n:'Pizza casera de masa fina con verduras',t:['cena'],i:'Harina, levadura, tomate, queso, verduras',p:'Estirar la masa, cubrir con salsa, queso y verduras en trozos finos, y hornear.'}
];

/* ---------- Estado ---------- */
let S, vista='hoy', cal=null, selDia=null;
function deSug(x){return {id:uid(),n:x.n,t:[...x.t],i:x.i,p:x.p}}
function generar(s){
  const off={desayuno:0,almuerzo:0,merienda:1,cena:3};
  SLOTS.forEach(sl=>{
    const lista=s.rep.filter(r=>r.t.includes(sl.k));
    for(let d=0;d<7;d++) s.plan[d][sl.k]=lista.length?lista[(d+off[sl.k])%lista.length].id:'';
  });
}
function nuevo(){
  const s={v:1,inicio:Date.now(),perfil:{},medidas:[],horarios:{desayuno:'08:00',almuerzo:'12:30',merienda:'16:30',cena:'20:00'},margen:0,
    rep:[],plan:Array.from({length:7},()=>({desayuno:'',almuerzo:'',merienda:'',cena:''})),over:{},reg:{}};
  SUG.filter(x=>x.ini).forEach(x=>s.rep.push(deSug(x)));
  generar(s);
  return s;
}
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const o=JSON.parse(raw);const b=nuevo();return Object.assign(b,o,{horarios:Object.assign(b.horarios,o.horarios||{})});}
  }catch(e){}
  const s=nuevo();
  try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}
  return s;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- Lógica de comidas ---------- */
const meal=id=>S.rep.find(r=>r.id===id);
function planId(d,sl){const o=S.over[ymd(d)];return (o&&Object.prototype.hasOwnProperty.call(o,sl))?o[sl]:S.plan[dIdx(d)][sl];}
const nombrePlan=(d,sl)=>(meal(planId(d,sl))||{}).n||'';
function hm(t){const [h,m]=t.split(':').map(Number);return [h||0,m||0];}
function ventana(d,i){
  const y=d.getFullYear(),mo=d.getMonth(),da=d.getDate(),mg=Number(S.margen)||0;
  const [h,m]=hm(S.horarios[SLOTS[i].k]);
  const ini=new Date(y,mo,da,h,m-mg);
  let fin;
  if(i<3){const [h2,m2]=hm(S.horarios[SLOTS[i+1].k]);fin=new Date(y,mo,da,h2,m2-mg);}
  else fin=new Date(y,mo,da+1,0,0);
  return {ini,fin,hora:new Date(y,mo,da,h,m)};
}
function estado(d,i,now){const w=ventana(d,i);return now<w.ini?'futuro':now<w.fin?'activo':'pasado';}
function sellar(){
  const now=new Date(),ini=new Date(S.inicio);let ch=false;
  for(let d=new Date(ini.getFullYear(),ini.getMonth(),ini.getDate());d<=now;d.setDate(d.getDate()+1)){
    const k=ymd(d);
    for(let i=0;i<4;i++){
      const w=ventana(d,i),sl=SLOTS[i].k;
      if(w.fin<=now&&w.fin.getTime()>S.inicio&&!(S.reg[k]&&S.reg[k][sl])){
        const n=nombrePlan(d,sl);
        if(n){(S.reg[k]=S.reg[k]||{})[sl]={comio:false,plato:n,ts:null};ch=true;}
      }
    }
  }
  if(ch)save();
}
function alergenos(){return (S.perfil.alergias||'').split(/[,;\n]/).map(x=>x.trim().toLowerCase()).filter(x=>x.length>2);}
function alerg(m){if(!m)return [];const t=(m.n+' '+m.i).toLowerCase();return alergenos().filter(a=>t.includes(a));}
function edadTxt(n){
  if(!n)return '';const b=parse(n),h=new Date();
  let m=(h.getFullYear()-b.getFullYear())*12+h.getMonth()-b.getMonth();if(h.getDate()<b.getDate())m--;
  if(m<0)return '';const a=Math.floor(m/12),r=m%12;
  return (a?a+(a===1?' año':' años'):'')+(a&&r?' y ':'')+(r||!a?r+(r===1?' mes':' meses'):'');
}
function opts(slot,sel){
  const tipados=S.rep.filter(r=>r.t.includes(slot)),otros=S.rep.filter(r=>!r.t.includes(slot));
  let h=`<option value="">— Sin comida programada —</option>`;
  tipados.forEach(r=>h+=`<option value="${r.id}" ${r.id===sel?'selected':''}>${esc(r.n)}</option>`);
  if(otros.length){h+='<optgroup label="Otras del repertorio">';otros.forEach(r=>h+=`<option value="${r.id}" ${r.id===sel?'selected':''}>${esc(r.n)}</option>`);h+='</optgroup>';}
  return h;
}

/* ---------- Acciones ---------- */
function marcar(k,sl){
  const i=SLOTS.findIndex(s=>s.k===sl),d=parse(k);
  if(estado(d,i,new Date())!=='activo'){render();return;}
  S.reg[k]=S.reg[k]||{};
  const r=S.reg[k][sl];
  if(r&&r.comio)delete S.reg[k][sl];
  else S.reg[k][sl]={comio:true,plato:nombrePlan(d,sl),ts:Date.now()};
  save();render();
}
function cambiar(k,sl,v){(S.over[k]=S.over[k]||{})[sl]=v;save();render();}
function setPlan(d,sl,v){S.plan[d][sl]=v;save();}
function regenerar(){if(confirm('¿Rearmar la semana automáticamente con tu repertorio? Se reemplaza el plan semanal actual (los registros no se tocan).')){generar(S);S.over={};save();render();}}
function ir(v){vista=v;render();window.scrollTo(0,0);}

/* ---------- Vistas ---------- */
const V={};
function cardSlot(d,i,now){
  const s=SLOTS[i],k=ymd(d),w=ventana(d,i),st=estado(d,i,now),id=planId(d,s.k),m=meal(id),rec=S.reg[k]&&S.reg[k][s.k];
  const nombre=rec?rec.plato:(m?m.n:'');
  const hh=`${pad(w.hora.getHours())}:${pad(w.hora.getMinutes())}`;
  let ctrl='';
  if(st==='pasado'){
    ctrl=rec?`<span class="res ${rec.comio?'ok':'no'}">${rec.comio?'✔ Comió':'✘ No comió'}</span>`:`<span class="pend">Sin comida programada</span>`;
  }else if(st==='activo'&&(m||rec)){
    ctrl=`<label class="chk"><input type="checkbox" ${rec&&rec.comio?'checked':''} onchange="marcar('${k}','${s.k}')"> Ha comido</label>`;
  }else if(st==='futuro'){
    ctrl=`<span class="pend">Se habilita a las ${hh}</span>`;
  }
  const w2=alerg(m);
  const sel=(st!=='pasado'&&!(rec&&rec.comio))?`<select onchange="cambiar('${k}','${s.k}',this.value)">${opts(s.k,id)}</select>`:'';
  return `<div class="card slot ${st==='activo'?'act':''} ${st==='pasado'?'pas':''}">
    <div class="top"><div><div class="hora">${s.e} ${s.n} · ${hh}</div><div class="nom">${nombre?esc(nombre):'<span class="pend">Sin comida programada</span>'}</div></div>${ctrl}</div>
    ${m&&st!=='pasado'?`<div class="mut">${esc(m.i)}</div>`:''}
    ${w2.length?`<div class="warn">⚠ Contiene: ${esc(w2.join(', '))} (alergia/intolerancia anotada)</div>`:''}
    ${sel}</div>`;
}
V.hoy=function(){
  const now=new Date(),d=new Date(now.getFullYear(),now.getMonth(),now.getDate()),k=ymd(d),p=S.perfil;
  const hecho=SLOTS.filter(s=>S.reg[k]&&S.reg[k][s.k]&&S.reg[k][s.k].comio).length;
  const ed=edadTxt(p.nacimiento);
  let h=`<div class="hdr"><div class="fecha">${fechaLarga(d)}</div>
    <div class="mut">${p.nombre?esc(p.nombre)+(ed?' · '+ed:''):'Completá el perfil del niño en la pestaña “Niño”'} · Hoy: ${hecho} de 4 comidas</div>
    ${p.alergias?`<div class="alerta">Alergias / intolerancias: ${esc(p.alergias)}</div>`:''}</div>`;
  for(let i=0;i<4;i++)h+=cardSlot(d,i,now);
  h+=`<div class="disc">Esta herramienta organiza la alimentación, pero no reemplaza el control médico pediátrico.</div>`;
  return h;
};
V.semana=function(){
  const hoy=dIdx(new Date());
  let h=`<h2>Semana tipo</h2><p class="mut">Este plan se repite todas las semanas. Para cambiar una comida solo de un día puntual, usá el selector en la pestaña “Hoy”.</p>`;
  DIAS.forEach((nm,di)=>{
    h+=`<div class="card ${di===hoy?'hoy':''}"><h3>${nm}${di===hoy?' · hoy':''}</h3>`;
    SLOTS.forEach(s=>{h+=`<label class="row"><span>${s.e} ${s.n}</span><select onchange="setPlan(${di},'${s.k}',this.value)">${opts(s.k,S.plan[di][s.k])}</select></label>`;});
    h+='</div>';
  });
  h+=`<div class="btns"><button class="sec" onclick="regenerar()">Rearmar semana automáticamente</button></div>`;
  return h;
};
V.repertorio=function(){
  let h=`<h2>Repertorio de comidas</h2><div class="btns"><button onclick="abrirForm()">+ Nueva comida</button></div>`;
  if(!S.rep.length)h+='<p class="mut">Todavía no hay comidas. Agregá una o elegí de las sugeridas.</p>';
  S.rep.forEach(r=>{
    const w=alerg(r);
    h+=`<div class="card"><b>${esc(r.n)}</b><div>${r.t.map(t=>`<span class="chip">${esc(cap(t))}</span>`).join('')}</div>
      <div class="mut">${esc(r.i)}</div>${r.p?`<div class="mut">${esc(r.p)}</div>`:''}
      ${w.length?`<div class="warn">⚠ Contiene: ${esc(w.join(', '))}</div>`:''}
      <div class="btns"><button class="sec sm" onclick="abrirForm('${r.id}')">Editar</button><button class="del sm" onclick="borrarItem('${r.id}')">Quitar</button></div></div>`;
  });
  const faltan=SUG.filter(x=>!S.rep.some(r=>r.n===x.n));
  h+=`<details class="card" ${faltan.length?'':'hidden'}><summary>Recetas básicas sugeridas (${faltan.length})</summary>
    <p class="mut">Adaptá texturas, porciones y cortes a la edad. Consultá con el pediatra sobre alérgenos, la miel (no antes de los 12 meses) y alimentos que pueden causar atragantamiento (frutos secos enteros, uvas enteras, etc.).</p>`;
  faltan.forEach(x=>{const ix=SUG.indexOf(x);h+=`<div style="border-top:1px solid var(--line);padding:8px 0"><b>${esc(x.n)}</b><div>${x.t.map(t=>`<span class="chip">${esc(cap(t))}</span>`).join('')}</div><div class="mut">${esc(x.i)}</div><button class="sec sm" onclick="agregarSug(${ix})">Agregar al repertorio</button></div>`;});
  h+='</details>';
  return h;
};
function agregarSug(ix){S.rep.push(deSug(SUG[ix]));save();render();}
function borrarItem(id){
  if(!confirm('¿Quitar esta comida del repertorio? También se quita del plan semanal. Los registros pasados se conservan.'))return;
  S.rep=S.rep.filter(r=>r.id!==id);
  S.plan.forEach(d=>SLOTS.forEach(s=>{if(d[s.k]===id)d[s.k]='';}));
  Object.values(S.over).forEach(o=>Object.keys(o).forEach(s=>{if(o[s]===id)o[s]='';}));
  save();render();
}
function abrirForm(id){
  const r=id?meal(id):{n:'',t:[],i:'',p:''};
  $m(`<div class="box"><h3>${id?'Editar comida':'Nueva comida'}</h3>
    <label class="f">Nombre</label><input id="f_n" value="${esc(r.n)}">
    <label class="f">Para qué comidas sirve</label><div class="tipos">${SLOTS.map(s=>`<label><input type="checkbox" class="f_t" value="${s.k}" ${r.t.includes(s.k)?'checked':''}> ${s.n}</label>`).join('')}</div>
    <label class="f">Ingredientes</label><textarea id="f_i">${esc(r.i)}</textarea>
    <label class="f">Preparación / notas</label><textarea id="f_p">${esc(r.p)}</textarea>
    <div class="btns"><button onclick="guardarItem('${id||''}')">Guardar</button><button class="sec" onclick="$m('')">Cancelar</button></div></div>`);
}
function guardarItem(id){
  const n=document.getElementById('f_n').value.trim();
  const t=[...document.querySelectorAll('.f_t:checked')].map(x=>x.value);
  if(!n){alert('Poné un nombre.');return;}
  if(!t.length){alert('Elegí al menos una comida (desayuno, almuerzo, etc.).');return;}
  const o={n,t,i:document.getElementById('f_i').value.trim(),p:document.getElementById('f_p').value.trim()};
  if(id){Object.assign(meal(id),o);}else S.rep.push(Object.assign({id:uid()},o));
  save();$m('');render();
}
function $m(h){document.getElementById('modal').innerHTML=h;}

/* Registro / calendario */
function dots(k){return SLOTS.map(s=>{const r=S.reg[k]&&S.reg[k][s.k];return `<i class="${r?(r.comio?'ok':'no'):'nd'}"></i>`;}).join('');}
function mes(n){const m=cal.m+n;if(m<0||m>11)return;cal.m=m;render();}
function selD(k){selDia=k;render();}
V.registro=function(){
  const hoy=new Date(),hk=ymd(hoy);
  if(!cal)cal={y:hoy.getFullYear(),m:hoy.getMonth()};
  if(!selDia)selDia=hk;
  const first=new Date(cal.y,cal.m,1),lead=dIdx(first),nd=new Date(cal.y,cal.m+1,0).getDate();
  let ok=0,tot=0;
  for(let d=1;d<=nd;d++){const r=S.reg[ymd(new Date(cal.y,cal.m,d))];if(r)SLOTS.forEach(s=>{if(r[s.k]){tot++;if(r[s.k].comio)ok++;}});}
  let h=`<h2>Registro</h2><div class="card"><div class="mes"><button class="sec sm" onclick="mes(-1)" ${cal.m===0?'disabled':''}>◀</button><b>${cap(MESES[cal.m])} ${cal.y}</b><button class="sec sm" onclick="mes(1)" ${cal.m===11?'disabled':''}>▶</button></div><div class="cal">`;
  DS.forEach(x=>h+=`<div class="dn">${x}</div>`);
  for(let i=0;i<lead;i++)h+='<div></div>';
  for(let d=1;d<=nd;d++){const k=ymd(new Date(cal.y,cal.m,d));h+=`<div class="c ${k===selDia?'sel':''} ${k===hk?'hoyc':''}" onclick="selD('${k}')">${d}<br>${dots(k)}</div>`;}
  h+=`</div><p class="mut" style="margin-bottom:0"><i class="ok" style="display:inline-block;width:7px;height:7px;border-radius:50%"></i> comió · <i class="no" style="display:inline-block;width:7px;height:7px;border-radius:50%"></i> no comió · <i class="nd" style="display:inline-block;width:7px;height:7px;border-radius:50%"></i> sin registro/pendiente<br>${tot?`Este mes: ${ok} de ${tot} comidas registradas como comidas.`:'Todavía no hay registros este mes.'}</p></div>`;
  const dd=parse(selDia),now=new Date();
  h+=`<div class="card"><h3>${fechaLarga(dd)}</h3>`;
  SLOTS.forEach((s,i)=>{
    const r=S.reg[selDia]&&S.reg[selDia][s.k],st=estado(dd,i,now),n=nombrePlan(dd,s.k);
    let t;
    if(r)t=`<span class="res ${r.comio?'ok':'no'}">${r.comio?'✔ Comió':'✘ No comió'}</span> · ${esc(r.plato)}`;
    else if(st!=='pasado')t=`<span class="pend">${st==='activo'?'En curso':'Pendiente'} · ${n?esc(n):'sin comida programada'}</span>`;
    else t=`<span class="pend">Sin registro</span>`;
    h+=`<div style="padding:6px 0;border-top:1px solid var(--line)"><span class="mut">${s.e} ${s.n}</span><br>${t}</div>`;
  });
  h+=`</div><div class="btns"><button onclick="exportarPDF()">Exportar PDF hasta ahora</button></div>
    <p class="mut">El PDF incluye todos los registros hasta la fecha y hora actuales.</p>`;
  return h;
};

/* Perfil */
function setP(k,v){S.perfil[k]=v;save();if(k==='nacimiento'){const e=document.getElementById('edad');if(e)e.textContent=edadTxt(v)||'—';}}
function setH(k,v){if(!v)return;S.horarios[k]=v;save();}
function setM(v){S.margen=Math.max(0,Math.min(120,Number(v)||0));save();}
function medirHoy(){
  const p=S.perfil;if(!p.peso&&!p.estatura){alert('Cargá peso y/o estatura primero.');return;}
  const f=ymd(new Date());S.medidas=S.medidas.filter(m=>m.f!==f);S.medidas.push({f,peso:p.peso||'',est:p.estatura||''});S.medidas.sort((a,b)=>a.f<b.f?-1:1);
  S.perfil.fechaMed=f;save();render();
}
function borrarMed(f){S.medidas=S.medidas.filter(m=>m.f!==f);save();render();}
function bajar(nombre,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nombre;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}
function expCopia(){bajar('copia-calendario-comidas-'+ymd(new Date())+'.json',new Blob([JSON.stringify(S)],{type:'application/json'}));}
function impCopia(inp){
  const f=inp.files[0];if(!f)return;const fr=new FileReader();
  fr.onload=()=>{try{const o=JSON.parse(fr.result);if(!o||!Array.isArray(o.rep)||!Array.isArray(o.plan))throw 0;
    if(!confirm('Esto reemplaza todos los datos actuales por los de la copia. ¿Continuar?'))return;S=Object.assign(nuevo(),o);save();cal=null;selDia=null;render();alert('Copia importada.');}catch(e){alert('El archivo no es una copia válida.');}};
  fr.readAsText(f);
}
function borrarTodo(){if(confirm('¿Borrar TODOS los datos (perfil, repertorio, plan y registro)? No se puede deshacer.')&&confirm('Última confirmación: se borra todo.')){localStorage.removeItem(KEY);S=nuevo();save();cal=null;selDia=null;ir('hoy');}}
V.nino=function(){
  const p=S.perfil;
  const inp=(k,lab,tipo='text',extra='')=>`<label class="f">${lab}</label><input type="${tipo}" ${extra} value="${esc(p[k])}" oninput="setP('${k}',this.value)" onchange="setP('${k}',this.value)">`;
  const ta=(k,lab)=>`<label class="f">${lab}</label><textarea oninput="setP('${k}',this.value)">${esc(p[k])}</textarea>`;
  let h=`<h2>Perfil del niño</h2><div class="card">
    ${inp('nombre','Nombre')}
    ${inp('nacimiento','Fecha de nacimiento','date')}
    <div class="mut">Edad: <b id="edad">${edadTxt(p.nacimiento)||'—'}</b></div>
    <label class="f">Sexo</label><select onchange="setP('sexo',this.value)"><option value="">—</option><option ${p.sexo==='Femenino'?'selected':''}>Femenino</option><option ${p.sexo==='Masculino'?'selected':''}>Masculino</option></select>
    ${inp('peso','Peso (kg)','number','step="0.1" min="0" inputmode="decimal"')}
    ${inp('estatura','Estatura (cm)','number','step="0.1" min="0" inputmode="decimal"')}
    <div class="btns"><button class="sec" onclick="medirHoy()">Guardar medición de hoy en el historial</button></div>
    ${S.medidas.length?`<div class="mut">Historial de mediciones:</div>`+[...S.medidas].reverse().slice(0,8).map(m=>`<div class="mut">${m.f.split('-').reverse().join('/')} · ${m.peso?esc(m.peso)+' kg':'—'} · ${m.est?esc(m.est)+' cm':'—'} <button class="del sm" onclick="borrarMed('${m.f}')">x</button></div>`).join(''):''}
  </div><div class="card"><h3>Datos pediátricos</h3>
    ${ta('alergias','Alergias e intolerancias alimentarias (separadas por coma; se usan para avisarte en las comidas)')}
    ${ta('noGusta','Alimentos que no le gustan o rechaza')}
    ${ta('favoritos','Alimentos favoritos')}
    ${inp('grupo','Grupo sanguíneo')}
    ${ta('medicacion','Medicación o suplementos')}
    ${ta('vacunas','Vacunas / carnet (notas)')}
    ${inp('pediatra','Pediatra (nombre y teléfono)')}
    ${inp('proximoControl','Próximo control pediátrico','date')}
    ${ta('notas','Otras notas')}
  </div><div class="card"><h3>Horarios de las comidas</h3>
    ${SLOTS.map(s=>`<label class="row"><span>${s.e} ${s.n}</span><input type="time" value="${S.horarios[s.k]}" onchange="setH('${s.k}',this.value)"></label>`).join('')}
    <label class="f">Minutos antes de la hora en que se habilita la casilla (0 = recién a la hora exacta)</label>
    <input type="number" min="0" max="120" value="${S.margen}" onchange="setM(this.value)">
    <p class="mut">La casilla “Ha comido” está disponible desde la hora de la comida hasta que empieza la siguiente (la cena, hasta medianoche). Después queda fija.</p>
  </div><div class="card"><h3>Datos en este navegador</h3>
    <p class="mut">Todo se guarda solo en este navegador. Si cambiás de teléfono o borrás los datos del navegador, se pierde: hacé copias de vez en cuando.</p>
    ${instalarEv?`<div class="btns"><button onclick="instalarApp()">Instalar app en este dispositivo</button></div>`:''}
    <div class="btns"><button class="sec" onclick="expCopia()">Exportar copia (.json)</button><button class="sec" onclick="document.getElementById('imp').click()">Importar copia</button><button class="del" onclick="borrarTodo()">Borrar todo</button></div>
    <input type="file" id="imp" accept=".json,application/json" hidden onchange="impCopia(this)"></div>`;
  return h;
};

/* ---------- PDF (sin librerías) ---------- */
function crearPDF(items){
  const W=595,H=842,M=44,pages=[[]];let y=H-M;
  const san=t=>String(t).replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/…/g,'...').replace(/[^\x00-\xff]/g,'?').replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
  for(const it of items){
    const sz=it.size||9,lh=it.lh||13;
    if(y-lh<M+10){pages.push([]);y=H-M;}
    y-=lh;
    for(const [t,x] of it.cols)pages[pages.length-1].push(`BT /${it.bold?'F2':'F1'} ${sz} Tf ${x} ${y.toFixed(1)} Td (${san(t)}) Tj ET`);
  }
  const n=pages.length;
  pages.forEach((c,i)=>c.push(`BT /F1 8 Tf ${W/2-30} 24 Td (Página ${i+1} de ${n}) Tj ET`));
  const objs=[];
  objs[1]='<< /Type /Catalog /Pages 2 0 R >>';
  objs[2]=`<< /Type /Pages /Kids [${pages.map((_,i)=>`${6+2*i} 0 R`).join(' ')}] /Count ${n} >>`;
  objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  pages.forEach((c,i)=>{
    const s=c.join('\n');
    objs[5+2*i]=`<< /Length ${s.length} >>\nstream\n${s}\nendstream`;
    objs[6+2*i]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${5+2*i} 0 R >>`;
  });
  let out='%PDF-1.4\n';const off=[];
  for(let i=1;i<objs.length;i++){off[i]=out.length;out+=`${i} 0 obj\n${objs[i]}\nendobj\n`;}
  const xr=out.length;
  out+=`xref\n0 ${objs.length}\n0000000000 65535 f \n`;
  for(let i=1;i<objs.length;i++)out+=String(off[i]).padStart(10,'0')+' 00000 n \n';
  out+=`trailer\n<< /Size ${objs.length} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;
  const u=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;
  return new Blob([u],{type:'application/pdf'});
}
function exportarPDF(){
  sellar();
  const now=new Date(),hk=ymd(now),p=S.perfil,items=[],A=(cols,o={})=>items.push(Object.assign({cols},o));
  const cut=(t,n)=>t.length>n?t.slice(0,n-1)+'…':t;
  const filas=[];
  const fechas=[...new Set([...Object.keys(S.reg),hk])].sort();
  fechas.forEach(k=>{
    const d=parse(k);
    SLOTS.forEach((s,i)=>{
      const r=S.reg[k]&&S.reg[k][s.k],w=ventana(d,i);
      const hh=`${pad(w.hora.getHours())}:${pad(w.hora.getMinutes())}`;
      if(r)filas.push({k,d,s:s.n,hh,pl:r.plato,es:r.comio?'Comió':'No comió',ok:r.comio});
      else if(k===hk&&estado(d,i,now)==='activo'&&nombrePlan(d,s.k))filas.push({k,d,s:s.n,hh,pl:nombrePlan(d,s.k),es:'En curso (sin marcar)',ok:null});
    });
  });
  const si=filas.filter(f=>f.ok===true).length,no=filas.filter(f=>f.ok===false).length;
  A([['Registro de alimentación',44]],{bold:1,size:17,lh:26});
  A([['Generado el '+fechaHora(now)+' (datos hasta ese momento)',44]]);
  A([['Este registro no reemplaza el control médico pediátrico.',44]],{size:8,lh:16});
  A([['Niño/a: '+(p.nombre||'—')+'   Edad: '+(edadTxt(p.nacimiento)||'—')+'   Peso: '+(p.peso?p.peso+' kg':'—')+'   Estatura: '+(p.estatura?p.estatura+' cm':'—'),44]]);
  if(p.alergias)A([['Alergias/intolerancias: '+cut(p.alergias.replace(/\s+/g,' '),95),44]]);
  if(p.pediatra)A([['Pediatra: '+cut(p.pediatra,95),44]]);
  if(S.medidas.length){A([['Últimas mediciones:',44]],{bold:1,lh:16});S.medidas.slice(-5).forEach(m=>A([[m.f.split('-').reverse().join('/')+'   '+(m.peso?m.peso+' kg':'—')+'   '+(m.est?m.est+' cm':'—'),54]]));}
  A([['Resumen: '+si+' comidas realizadas, '+no+' no realizadas, de '+(si+no)+' resueltas.',44]],{bold:1,lh:22});
  A([['Fecha',44],['Comida',130],['Hora',200],['Plato',245],['Estado',455]],{bold:1,lh:16});
  let ant='';
  if(!filas.length)A([['Todavía no hay registros.',44]]);
  filas.forEach(f=>{
    if(ant&&f.k!==ant)items.push({cols:[],lh:5});
    ant=f.k;
    A([[fechaCorta(f.d),44],[f.s,130],[f.hh,200],[cut(f.pl,44),245],[f.es,455]]);
  });
  bajar('registro-comidas-'+ymd(now)+'.pdf',crearPDF(items));
}

/* ---------- Instalación (PWA) ---------- */
let instalarEv=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();instalarEv=e;if(vista==='nino')render();});
window.addEventListener('appinstalled',()=>{instalarEv=null;if(vista==='nino')render();});
function instalarApp(){if(!instalarEv)return;instalarEv.prompt();instalarEv.userChoice.finally(()=>{instalarEv=null;render();});}
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{});});}

/* ---------- Render ---------- */
function render(){
  sellar();
  const tabs=[['hoy','📅','Hoy'],['semana','🗓️','Semana'],['repertorio','🍽️','Comidas'],['registro','📋','Registro'],['nino','🧒','Niño']];
  document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${vista===t[0]?'on':''}" onclick="ir('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join('');
  document.getElementById('main').innerHTML=V[vista]();
}
S=load();
render();
setInterval(()=>{
  const a=document.activeElement;
  if(a&&['SELECT','INPUT','TEXTAREA'].includes(a.tagName))return;
  if(document.getElementById('modal').innerHTML)return;
  render();
},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!document.getElementById('modal').innerHTML)render();});
</script>
